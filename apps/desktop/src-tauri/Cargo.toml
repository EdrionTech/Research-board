[package]
name = "research-board"
version = "0.1.0"
description = "Research Board, the desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# SQLite itself, built into the app (no separate install)
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
# links to websites open in your browser, not inside the app
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
