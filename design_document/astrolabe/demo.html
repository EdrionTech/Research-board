<!doctype html>
<html lang="en" data-theme="deepsky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrolabe — demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/astrolabe.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/astrolabe.js"></script>
<style>
  .page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-8); }
  .top { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: var(--space-3); color: var(--ink); }
  .brand .title { margin: 0; }
  .hero { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-height: 460px; width: 100%; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-copy { position: absolute; left: 0; top: 0; bottom: 0; width: min(46%, 460px); padding: var(--space-6); display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-3); }
  .hero-copy .display, .hero-copy p { margin: 0; color: var(--ink); }
  .hero-copy p { color: var(--ink-muted); max-width: 34ch; }
  .layout { display: grid; grid-template-columns: 1fr; gap: var(--space-6); }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
  .readouts { display: flex; flex-wrap: wrap; gap: var(--space-6); }
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: var(--space-5); }
  .card { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .card div { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
  .card h4 { margin: 0; }
  .who { display: flex; align-items: center; gap: var(--space-3); }
  .who img { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); }
  .col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
  @media (max-width: 599px) { .hero { aspect-ratio: auto; max-height: none; background: var(--surface); } .hero img { position: static; display: block; aspect-ratio: 16 / 9; height: auto; } .hero-copy { position: static; width: 100%; padding: var(--space-5); } .hero-copy .display { font-size: 40px; line-height: 44px; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Astrolabe, h = React.createElement;
  function App() {
    var t = React.useState(true), night = t[0];
    var tab = React.useState(0);
    React.useEffect(function () { document.documentElement.dataset.theme = night ? 'deepsky' : 'atlas'; }, [night]);
    var th = night ? 'deepsky' : 'atlas';
    var img = function (n) { return 'images/placeholders/svg/' + n + '-' + th + '.svg'; };
    var projects = [['Lunar survey', 'K5III', 'Mapping craters along the terminator.'], ['Comet watch', 'B8Ia', 'Tracking C/2026 A1 as it brightens.'], ['Deep-sky log', 'G2V', 'Messier objects seen from Accra.']];
    return h('div', { className: 'page' },
      h('header', { className: 'top' },
        h('div', { className: 'brand' }, h(A.Icon, { name: 'astrolabe', size: 28 }), h('h1', { className: 'title' }, 'Astrolabe')),
        h(A.Tabs, { label: 'Sections', id: 'nav', tabs: [{ label: 'Tonight', icon: 'moon' }, { label: 'Projects', icon: 'planet' }, { label: 'Catalogue', icon: 'stars' }], value: tab[0], onChange: tab[1] }),
        h(A.MoonToggle, { label: 'Night sky', checked: night, onChange: t[1] })),
      h('section', { className: 'hero' },
        h('img', { src: img('project-cover'), alt: '' }),
        h('div', { className: 'hero-copy' },
          h('h2', { className: 'display' }, 'Saturn at opposition'),
          h('p', { className: 'body' }, 'The ringed planet is closest and brightest this week. Best seen after 21:00, low in the east.'),
          h('div', { className: 'as-row' }, h(A.Button, { orbit: true, size: 'lg', icon: 'telescope' }, 'Plan a night'), h(A.Button, { variant: 'ghost' }, 'Learn more')))),
      h('div', { className: 'layout' },
        h('div', { className: 'col' },
          h(A.Panel, { title: 'Tonight from Accra', coords: '5.6° N · 0.2° W', halo: true },
            h('div', { className: 'readouts' },
              h(A.Readout, { label: 'Seeing', value: '4.0', caption: 'out of 5', tone: 'star' }),
              h(A.Readout, { label: 'Moon', value: '18', unit: '%', caption: 'waxing crescent', tone: 'sun' }),
              h(A.Readout, { label: 'Dark in', value: '01:12', caption: 'astronomical dusk', tone: 'aurora' }))),
          h('h3', { className: 'heading' }, 'Projects'),
          h('div', { className: 'projects' }, projects.map(function (p, i) {
            return h('article', { key: i, className: 'card' }, h('img', { src: img('project-thumb'), alt: '' }),
              h('div', null, h(A.SpectralTag, { cls: p[1] }), h('h4', { className: 'heading' }, p[0]), h('p', { className: 'small', style: { margin: 0, color: 'var(--ink-muted)' } }, p[2])));
          }))),
        h('div', { className: 'col' },
          h(A.Panel, { title: 'Observing plan' },
            h('div', { className: 'as-stack' },
              h(A.Constellation, { steps: ['Target', 'Align', 'Capture', 'Process'], current: 2 }),
              h(A.TextField, { label: 'Object', icon: 'search', placeholder: 'M42, Saturn, Vega…' }),
              h(A.Slider, { label: 'Exposure', tone: 'sun', min: 1, max: 60, defaultValue: 20, format: function (v) { return v + ' s'; } }),
              h(A.MoonToggle, { label: 'Track the target', defaultChecked: true }),
              h('div', { className: 'as-row' }, h(A.Button, { icon: 'play' }, 'Start'), h(A.Button, { variant: 'outline', tone: 'nova', icon: 'close' }, 'Abort')))),
          h(A.Panel, { title: 'Observer' },
            h('div', { className: 'who' }, h('img', { src: img('avatar'), alt: '' }), h('div', null, h('div', { className: 'body' }, 'New observer'), h('div', { className: 'small', style: { color: 'var(--ink-muted)' } }, 'Add a photo in settings'))),
            h('div', { className: 'as-row', style: { marginTop: 16 } }, h(A.OrbitButton, { icon: 'settings', label: 'Settings' }), h(A.OrbitButton, { icon: 'satellite', label: 'Satellites', tone: 'aurora' }), h(A.OrbitButton, { icon: 'comet', label: 'Comets', tone: 'sun' }))))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
