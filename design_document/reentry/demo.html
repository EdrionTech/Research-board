<!doctype html>
<html lang="en" data-theme="cockpit">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reentry — demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/reentry.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/reentry.js"></script>
<style>
  .page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-6); }
  .top { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: var(--space-3); }
  .brand .title { margin: 0; }
  .hero { position: relative; border-radius: var(--radius-md); overflow: hidden; border: 1.5px solid var(--outline); box-shadow: var(--shadow-cel); aspect-ratio: 16 / 9; max-height: 480px; width: 100%; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-copy { position: absolute; left: var(--space-6); bottom: var(--space-6); width: min(52%, 520px); display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start; }
  .hero-copy .re-titlecard { width: 100%; }
  .layout { display: grid; grid-template-columns: 1fr; gap: var(--space-5); }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
  .col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
  .gauges { display: flex; flex-wrap: wrap; gap: var(--space-5); justify-content: space-around; margin-top: var(--space-4); }
  .squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: var(--space-5); }
  .card { border-radius: var(--radius-md); overflow: hidden; border: 1.5px solid var(--outline); background: var(--plate); box-shadow: var(--shadow-cel); }
  .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-bottom: 1.5px solid var(--outline); }
  .card div { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); align-items: flex-start; }
  .card h4 { margin: 0; }
  .pilot { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
  .pilot img { width: 56px; height: 56px; border-radius: var(--radius-sm); border: 1.5px solid var(--outline); }
  .lamps { display: flex; flex-wrap: wrap; gap: var(--space-4); }
  @media (max-width: 599px) {
    .hero { aspect-ratio: auto; max-height: none; background: var(--letterbox); }
    .hero img { position: static; display: block; aspect-ratio: 16 / 9; height: auto; }
    .hero-copy { position: static; width: 100%; padding: var(--space-4); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var R = window.Reentry, h = React.createElement;
  function App() {
    var t = React.useState(false), day = t[0];
    var thr = React.useState(72);
    React.useEffect(function () { document.documentElement.dataset.theme = day ? 'hangar' : 'cockpit'; }, [day]);
    var th = day ? 'hangar' : 'cockpit';
    var img = function (n) { return 'images/placeholders/svg/' + n + '-' + th + '.svg'; };
    var heat = Math.round(900 + thr[0] * 10);
    return h('div', { className: 'page' },
      h('header', { className: 'top' },
        h('div', { className: 'brand' }, h(R.Icon, { name: 'pod', size: 30 }), h('h1', { className: 'title' }, 'Reentry')),
        h(R.Tabs, { label: 'Console', id: 'nav', tabs: [{ label: 'Mission', icon: 'horizon' }, { label: 'Squad', icon: 'helmet' }, { label: 'Comms', icon: 'signal' }] }),
        h(R.Switch, { label: 'Hangar lights', checked: day, onChange: t[1] })),
      h('section', { className: 'hero' },
        h('img', { src: img('project-cover'), alt: '' }),
        h('div', { className: 'hero-copy' },
          h(R.TitleCard, { as: 'h2', kicker: 'Mission 07 · Sector 7G', title: 'Orbital drop', subtitle: 'Hold on' }),
          h('div', { className: 're-row' }, h(R.Button, { size: 'lg', icon: 'thrust' }, 'Engage'), h(R.Button, { tone: 'white' }, 'Briefing')))),
      h(R.Hazard, { title: 'Turbulence ahead', live: true }, 'Expect heavy shaking for 40 seconds after the burn.'),
      h('div', { className: 'layout' },
        h('div', { className: 'col' },
          h(R.Plate, { title: 'Descent', code: 'UNIT-04', footer: 'Telemetry every 0.5 s' },
            h(R.Screen, { title: 'Pod 04', status: 'T+00:14', cursor: true },
              h('p', null, 'ALT  118 400 M'), h('p', null, 'VEL    7.42 KM/S'), h('p', { className: heat > 1500 ? 're-hot' : null }, 'HULL   ' + heat + ' °C'), h('p', { className: 're-dim' }, 'BURN IN 00:14 >')),
            h('div', { className: 'gauges' },
              h(R.Gauge, { label: 'Velocity', value: 7.4, max: 10, unit: 'KM/S', format: function (v) { return v % 1 ? v.toFixed(1) : String(v); } }),
              h(R.Gauge, { label: 'Hull temp', value: heat, max: 2000, unit: '°C', redline: .75 }))),
          h('h3', { className: 'heading' }, 'Squad'),
          h('div', { className: 'squad' }, [['Lunar relay', 'SEC 2A', 'Fixing the far-side relay before dawn.'], ['Cloud cover', 'SEC 7G', 'Mapping the storm front below.'], ['Pad 39', 'SEC 1C', 'Launch window opens in 3 hours.']].map(function (p, i) {
            return h('article', { key: i, className: 'card' }, h('img', { src: img('project-thumb'), alt: '' }),
              h('div', null, h('span', { className: 're-plate-code' }, p[1]), h('h4', { className: 'heading' }, p[0]), h('p', { className: 'small', style: { margin: 0, color: 'var(--ink-muted)' } }, p[2])));
          }))),
        h('div', { className: 'col' },
          h(R.Plate, { title: 'Controls', stripe: true },
            h('div', { className: 're-stack' },
              h(R.Slider, { label: 'Throttle', value: thr[0], onChange: function (e) { thr[1](Number(e.target.value)); }, format: function (v) { return v + '%'; } }),
              h(R.SegmentBar, { label: 'Heat shield', value: 100 - Math.round(thr[0] * .6) }),
              h(R.SegmentBar, { label: 'Fuel', value: 18 }),
              h(R.Switch, { label: 'Drogue chute', onText: 'ARMED', offText: 'SAFE' }),
              h(R.TextField, { label: 'Drop zone', icon: 'reticle', defaultValue: '7G' }),
              h('div', { className: 're-row' }, h(R.Button, { tone: 'red', icon: 'eject' }, 'Abort'), h(R.Button, { tone: 'steel', icon: 'settings' }, 'Systems')))),
          h(R.Plate, { title: 'Pilot' },
            h('div', { className: 'pilot' }, h('img', { src: img('avatar'), alt: '' }), h('div', null, h('div', { className: 'body' }, 'New pilot'), h('div', { className: 'small', style: { color: 'var(--ink-muted)' } }, 'Add a photo in settings'))),
            h('div', { className: 'lamps' }, h(R.Lamp, { color: 'green' }, 'Life support'), h(R.Lamp, { color: 'blue' }, 'Uplink'), h(R.Lamp, { color: 'amber', state: 'blink' }, 'Standby'))))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
