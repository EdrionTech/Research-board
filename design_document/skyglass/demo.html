<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyglass — demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/skyglass.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/skyglass.js"></script>
<style>
  .app { display: grid; grid-template-columns: 1fr; gap: var(--space-6); max-width: 1200px; margin: 0 auto; }
  .side { display: none; }
  @media (min-width: 900px) { .app { grid-template-columns: 220px minmax(0, 1fr); } .side { display: block; align-self: start; position: sticky; top: var(--space-5); } }
  .nav { display: flex; flex-direction: column; gap: var(--space-1); }
  .nav button { all: unset; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2); border-radius: var(--radius-md); cursor: pointer; font-weight: 600; min-height: 44px; }
  .nav button:hover { background: var(--glass-strong); }
  .nav button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
  .main { display: flex; flex-direction: column; gap: var(--space-6); min-width: 0; }
  .dock { position: sticky; bottom: var(--space-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Skyglass, h = React.createElement;
  var nav = [['home','blue','Home'],['search','aqua','Search'],['music','aqua','Library'],['heart','red','Liked songs'],['mail','orange','Messages'],['settings','glass','Settings']];
  var tracks = [{title:'Peach Field',artist:'Paradise Creator',meta:'1,204'},{title:'Lotus Waters',artist:'Yume Isle',meta:'54,147'},{title:'Lease of Light',artist:'Takeshi Abo',meta:'311,881'},{title:'Aquatic Ambience',artist:'Scizzie',meta:'43,238'}];
  function App() {
    var t = React.useState('day'), theme = t[0];
    var a = React.useState(0), active = a[0];
    var c = React.useState('Top'), chip = c[0];
    React.useEffect(function(){ document.documentElement.dataset.theme = theme; }, [theme]);
    return h('div', { className: 'app' },
      h('aside', { className: 'side' }, h(S.GlassPanel, null, h('nav', { className: 'nav', 'aria-label': 'Main' },
        nav.map(function (n) { return h('button', { key: n[0] }, h(S.IconBadge, { name: n[0], tone: n[1], size: 'sm' }), n[2]); })))),
      h('main', { className: 'main' },
        h('div', { className: 'top' },
          h('h1', { className: 'display', style: { margin: 0 } }, 'Good morning'),
          h(S.Button, { tone: 'glass', size: 'sm', icon: 'sun', onClick: function(){ t[1](theme === 'day' ? 'sea' : 'day'); } }, theme === 'day' ? 'Deep sea' : 'Day sky')),
        h(S.TextField, { icon: 'search', placeholder: 'What do you want to play?', 'aria-label': 'Search' }),
        h('div', { className: 'sg-row' }, ['Top','Hot','New'].map(function (x, i) { return h(S.Chip, { key: x, icon: ['sun','heart','plus'][i], selected: chip === x, onClick: function(){ c[1](x); } }, x); })),
        h('div', { className: 'sg-grid' },
          h(S.GlassPanel, { title: 'Recommended for today', action: 'Show all' },
            h('div', { className: 'sg-row' }, h(S.Button, { tone: 'green' }, 'Accept'), h(S.Button, { tone: 'red' }, 'Decline'), h(S.Button, { tone: 'blue', icon: 'user' }, 'Follow'), h(S.Button, { tone: 'orange', icon: 'download' }, 'Download'))),
          h(S.GlassPanel, { title: 'Apps' },
            h('div', { className: 'sg-row', style: { gap: 20, paddingBottom: 24 } }, h(S.AppTile, { icon: 'mail', label: 'Mail', tone: 'green' }), h(S.AppTile, { icon: 'settings', label: 'Settings' }), h(S.AppTile, { icon: 'image', label: 'Photos', tone: 'blue' })))),
        h(S.TrackList, { tracks: tracks, activeIndex: active, onSelect: a[1] }),
        h('div', { className: 'dock' }, h(S.MediaBar, { title: tracks[active].title, artist: tracks[active].artist, duration: 221, position: 64 }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
