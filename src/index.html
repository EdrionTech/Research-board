<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <title>Research Board</title>
    <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/style.css">
    <!-- theme + style, before the page draws -->
    <!-- the data, when the local server is running (server/server.js); else the browser keeps it -->
    <script src="/api/boot.js"></script>
    <script src="script/core/settings.js"></script>
    <script src="script/core/nav.js"></script>
</head>

<body>
    <div class="bar">
        <h2 class="brand"><img class="brand_logo" src="assets/logo.svg" alt="">Research Board</h2>
        <input type="search" class="search" id="search" placeholder="Search projects...">
        <a class="btn settings_link" href="page/settings.html" title="Theme, style and your data">Settings</a>
        <a href="page/library.html" class="btn library_link" title="Literature library">Library</a>
        <button type="button" class="btn primary" id="new_project">+ New project</button>
    </div>

    <!-- cards are rendered by app.js; this one is the template -->
    <template id="project_template">
        <div class="project" tabindex="0">
            <img alt="Project thumbnail" class="project_thumbnail">
            <div class="overhead">
                <div class="hover_hide">
                    <button type="button" class="edit">Edit</button>
                    <button type="button" class="delete">Delete</button>
                </div>
                <h1 class="project_title"></h1>
                <p class="desc"></p>
            </div>
        </div>
    </template>

    <div class="project_shelf" id="shelf"></div>
    <p class="empty" id="empty" hidden>No projects yet. Click <b>+ New project</b> to start one.</p>


    <div class="modals" id="modals" hidden>
        <!-- create / edit -->
        <form class="project_form modal" id="project_form" hidden>
            <h2 id="form_heading">New project</h2>
            <label>Title <input name="title" required maxlength="80"></label>
            <label>Description <textarea name="desc" rows="3"></textarea></label>
            <!-- a link or an uploaded image (images.js) -->
            <div id="project_image"></div>
            <div class="actions">
                <button type="button" class="btn" data-close>Cancel</button>
                <button type="submit" class="btn primary">Save</button>
            </div>
        </form>

        <!-- preview a project before opening its dashboard -->
        <div class="open_project modal" id="open_project" hidden>
            <img class="hero" alt="">
            <div class="body">
                <h2 class="title"></h2>
                <p class="desc"></p>
                <div class="actions">
                    <button type="button" class="btn" data-close>Close</button>
                    <a class="btn primary open">Open</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script/core/store.js"></script>
    <script src="script/core/images.js"></script>
    <script src="script/pages/home.js"></script>
</body>

</html>
